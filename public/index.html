<!doctype html>

<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Rastreamento</title>

    <!-- =====================================================
       ZENDESK WEBVIEW SDK
       ===================================================== -->

    <script>
      (function (d, s, id) {
        var js;
        var fjs = d.getElementsByTagName(s)[0];

        if (d.getElementById(id)) {
          return;
        }

        js = d.createElement(s);

        js.id = id;

        js.src = "https://static.zdassets.com/conversation-extensions/latest/sdk.js";

        fjs.parentNode.insertBefore(js, fjs);
      })(document, "script", "WebviewSdkScript");

      window.webviewSdkInit = function (WebviewSdk) {
        window.WebviewSdk = WebviewSdk;

        console.log("Zendesk Webview SDK carregado");

        if (WebviewSdk.hasFeature("setTitle")) {
          WebviewSdk.setTitle("Rastreamento");
        }
      };
    </script>

    <!-- =====================================================
       CSS
       ===================================================== -->

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;

        padding: 20px;

        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;

        background: #ffffff;

        color: #1f2937;
      }

      .container {
        max-width: 500px;

        margin: 0 auto;
      }

      .header {
        margin-bottom: 24px;
      }

      .header h1 {
        margin: 0 0 6px;

        font-size: 22px;

        font-weight: 700;
      }

      .header p {
        margin: 0;

        color: #6b7280;

        font-size: 14px;
      }

      .order {
        margin-bottom: 24px;

        padding: 14px 16px;

        background: #f8fafc;

        border: 1px solid #e5e7eb;

        border-radius: 8px;
      }

      .order-label {
        margin-bottom: 4px;

        font-size: 12px;

        color: #6b7280;
      }

      .order-id {
        font-size: 15px;

        font-weight: 600;
      }

      .timeline {
        position: relative;
      }

      .timeline-item {
        position: relative;

        display: flex;

        gap: 14px;

        padding-bottom: 28px;
      }

      .timeline-item:last-child {
        padding-bottom: 0;
      }

      .timeline-item:not(:last-child)::before {
        content: "";

        position: absolute;

        left: 7px;

        top: 16px;

        bottom: 0;

        width: 2px;

        background: #e5e7eb;
      }

      .dot {
        position: relative;

        z-index: 2;

        flex-shrink: 0;

        width: 16px;

        height: 16px;

        margin-top: 1px;

        border-radius: 50%;

        background: #9ca3af;

        border: 3px solid #ffffff;

        box-shadow: 0 0 0 1px #d1d5db;
      }

      .timeline-item.current .dot {
        background: #2563eb;

        box-shadow: 0 0 0 1px #2563eb;
      }

      .content {
        flex: 1;
      }

      .description {
        margin: 0 0 5px;

        font-size: 15px;

        font-weight: 700;
      }

      .date {
        margin: 0 0 4px;

        font-size: 13px;

        color: #4b5563;
      }

      .location {
        margin: 0;

        font-size: 13px;

        color: #6b7280;
      }

      .current-label {
        display: inline-block;

        margin-bottom: 7px;

        padding: 3px 7px;

        border-radius: 4px;

        background: #eff6ff;

        color: #2563eb;

        font-size: 11px;

        font-weight: 600;
      }

      .loading {
        padding: 30px 0;

        text-align: center;

        color: #6b7280;

        font-size: 14px;
      }

      .error {
        padding: 16px;

        border-radius: 8px;

        background: #fef2f2;

        border: 1px solid #fecaca;

        color: #991b1b;

        font-size: 14px;
      }

      .close-button {
        width: 100%;

        margin-top: 30px;

        padding: 12px;

        border: 0;

        border-radius: 7px;

        background: #f3f4f6;

        color: #374151;

        font-size: 14px;

        cursor: pointer;
      }

      .close-button:hover {
        background: #e5e7eb;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="header">
        <h1>Rastreamento</h1>

        <p>Histórico de movimentações do pedido</p>
      </div>

      <div id="order" class="order" style="display: none">
        <div class="order-label">Pedido</div>

        <div id="orderId" class="order-id"></div>
      </div>

      <div id="loading" class="loading">Carregando rastreamento...</div>

      <div id="error" class="error" style="display: none"></div>

      <div id="timeline" class="timeline"></div>

      <button id="closeButton" class="close-button" onclick="closeWebview()">Fechar</button>
    </div>

    <script>
      // =====================================================
      // CONVERSATION ID
      // =====================================================

      const params = new URLSearchParams(window.location.search);

      const conversationId = params.get("conversationId");

      console.log("conversationId:", conversationId);

      // =====================================================
      // FORMATAR DATA
      // =====================================================

      function formatDate(value) {
        if (!value) {
          return "-";
        }

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {
          return value;
        }

        return new Intl.DateTimeFormat("pt-BR", {
          day: "2-digit",

          month: "2-digit",

          year: "numeric",

          hour: "2-digit",

          minute: "2-digit",
        }).format(date);
      }

      // =====================================================
      // ESCAPAR HTML
      // =====================================================

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      // =====================================================
      // RENDERIZAR TRACKING
      // =====================================================

      function renderTracking(data) {
        const timeline = document.getElementById("timeline");

        const order = document.getElementById("order");

        const orderId = document.getElementById("orderId");

        if (data.orderId) {
          orderId.textContent = data.orderId;

          order.style.display = "block";
        }

        if (!data.events || !data.events.length) {
          timeline.innerHTML = `

          <div class="loading">

            Nenhum evento de rastreamento encontrado.

          </div>

        `;

          return;
        }

        timeline.innerHTML = data.events
          .map((event, index) => {
            const isCurrent = index === 0;

            return `

                <div
                  class="timeline-item ${isCurrent ? "current" : ""}"
                >

                  <div class="dot"></div>

                  <div class="content">

                    ${
                      isCurrent
                        ? `
                          <div class="current-label">
                            Status atual
                          </div>
                        `
                        : ""
                    }

                    <p class="description">

                      ${escapeHtml(event.descricao)}

                    </p>

                    <p class="date">

                      ${formatDate(event.data)}

                    </p>

                    <p class="location">

                      ${escapeHtml(event.cidade)}

                      -

                      ${escapeHtml(event.uf)}

                    </p>

                  </div>

                </div>

              `;
          })
          .join("");
      }

      // =====================================================
      // CARREGAR TRACKING
      // =====================================================

      async function loadTracking() {
        const loading = document.getElementById("loading");

        const error = document.getElementById("error");

        try {
          const response = await fetch("/api/tracking");

          if (!response.ok) {
            throw new Error("Erro ao consultar rastreamento");
          }

          const data = await response.json();

          loading.style.display = "none";

          renderTracking(data);
        } catch (err) {
          console.error(err);

          loading.style.display = "none";

          error.style.display = "block";

          error.textContent = "Não foi possível carregar o rastreamento.";
        }
      }

      // =====================================================
      // FECHAR WEBVIEW
      // =====================================================

      function closeWebview() {
        if (window.WebviewSdk && window.WebviewSdk.hasFeature("close")) {
          window.WebviewSdk.close(() => {
            console.log("Webview fechada");
          });

          return;
        }

        console.log("Webview SDK não disponível");
      }

      // =====================================================
      // INIT
      // =====================================================

      loadTracking();
    </script>
  </body>
</html>
