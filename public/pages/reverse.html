<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <!-- A URL carrega o token da sessão: não enviar como referrer para outros sites -->
    <meta name="referrer" content="no-referrer" />
    <title>Troca e devolução</title>

    <!-- Tema da marca antes da primeira pintura (sem "piscar" no azul padrão).
         As fontes de cada marca vêm do Google Fonts, só as da marca aberta. -->
    <script>
      (function () {
        var FONTS = {
          mizuno: "family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,800",
          olympikus: "family=Roboto+Condensed:ital,wght@0,600;0,700;0,800;1,800&family=Roboto:wght@400;500;700",
          underarmour: "family=Archivo:wght@700;800;900&family=Inter:wght@400;500;600;700",
        };
        var store = (new URLSearchParams(window.location.search).get("store") || "").toLowerCase();
        if (!Object.prototype.hasOwnProperty.call(FONTS, store)) return;
        document.documentElement.setAttribute("data-brand", store);
        var link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = "https://fonts.googleapis.com/css2?" + FONTS[store] + "&display=swap";
        document.head.appendChild(link);
      })();
    </script>

    <!-- Zendesk Webview SDK -->
    <script>
      (function (d, s, id) {
        var js;
        var fjs = d.getElementsByTagName(s)[0];
        if (d.getElementById(id)) return;
        js = d.createElement(s);
        js.id = id;
        js.src = "https://static.zdassets.com/conversation-extensions/latest/sdk.js";
        fjs.parentNode.insertBefore(js, fjs);
      })(document, "script", "WebviewSdkScript");

      window.webviewSdkInit = function (WebviewSdk) {
        window.WebviewSdk = WebviewSdk;
        if (WebviewSdk.hasFeature("setTitle")) {
          WebviewSdk.setTitle("Troca e devolução");
        }
      };
    </script>

    <!-- Tailwind CSS (Play CDN, versão fixada) -->
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script>
      // A paleta "blue" usada nas telas passa a ser a cor da marca (variáveis em reverse.css)
      var shade = function (n) {
        return "rgb(var(--brand-" + n + ") / <alpha-value>)";
      };
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              blue: { 50: shade(50), 100: shade(100), 200: shade(200), 300: shade(300), 400: shade(400), 500: shade(500), 600: shade(600), 700: shade(700), 800: shade(800), 900: shade(900) },
            },
            fontFamily: {
              sans: ["var(--font-body)", "ui-sans-serif", "system-ui", "sans-serif"],
              display: ["var(--font-display)", "ui-sans-serif", "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>

    <!-- Lucide Icons (versão fixada) -->
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>

    <link rel="stylesheet" href="../css/reverse.css" />
  </head>
  <body class="brand-page text-slate-800 antialiased font-sans min-h-screen select-none">
    <div class="shell">
      <!-- Painel da marca: só em telas largas (link no navegador, tablet, widget em tela cheia) -->
      <aside class="brand-aside" aria-label="Etapas">
        <div class="brand-aside-inner">
          <span class="brand-logo" data-brand-logo></span>
          <div class="brand-aside-hero">
            <p class="brand-eyebrow" id="asideEyebrow">Central de trocas</p>
            <h1 class="brand-hero-title font-display">Troca e<br /><span class="accent">devolução</span></h1>
            <p class="brand-aside-text">Troque, devolva ou acompanhe sua solicitação em poucos passos.</p>
          </div>
          <ol class="stepper" id="stepper"></ol>
        </div>
      </aside>

      <div class="shell-main">
        <header class="brand-header">
          <div class="flex items-center gap-2.5 min-w-0">
            <button id="headerBackBtn" class="brand-back hidden" aria-label="Voltar">
              <i data-lucide="arrow-left" class="w-4 h-4"></i>
            </button>
            <span id="headerTitle" class="brand-header-title font-display truncate">Troca e devolução</span>
          </div>
          <span class="brand-logo brand-logo-header" data-brand-logo></span>
        </header>
        <div class="progress" aria-hidden="true"><span id="progressFill"></span></div>

        <main id="app" class="app-main">
          <!-- Cada etapa do fluxo é desenhada aqui (public/js/reverse/screens) -->
          <div id="screen" aria-live="polite">
            <div class="flex flex-col items-center justify-center py-16 text-slate-500">
              <div class="w-8 h-8 border-2 border-blue-200 border-t-blue-600 rounded-full animate-spin mb-3"></div>
              <p class="text-sm">Carregando...</p>
            </div>
          </div>
          <noscript>
            <p class="text-sm text-slate-700 text-center py-8">Ative o JavaScript para fazer sua troca ou devolução.</p>
          </noscript>
        </main>
      </div>
    </div>

    <script type="module" src="../js/reverse/main.js"></script>
  </body>
</html>
