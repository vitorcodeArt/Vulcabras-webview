<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catálogo de Produtos - Mizuno</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <!-- Catálogo CSS -->
    <link rel="stylesheet" href="../css/catalog.css" />
  </head>
  <body class="bg-gray-50">
    <!-- Header -->
    <header class="bg-white shadow-sm py-4">
      <div class="container">
        <div class="flex items-center justify-between">
          <h1 class="text-2xl font-bold text-gray-800">Catálogo Mizuno</h1>
          <a href="/" class="text-blue-600 hover:text-blue-800 text-sm font-medium"> ← Voltar </a>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="container py-8">
      <!-- Seção de Categorias -->
      <section class="mb-12">
        <h2 class="text-xl font-semibold text-gray-800 mb-6">Selecione uma Categoria</h2>
        <div id="categoriesContainer" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4">
          <!-- Botões de categorias carregados dinamicamente -->
        </div>
      </section>

      <!-- Seção de Produtos (Carrossel) -->
      <section id="productsSection" class="mb-12 hidden">
        <div class="flex items-center justify-between mb-6">
          <h2 id="categoryTitle" class="text-xl font-semibold text-gray-800"></h2>
          <button id="clearCategoryBtn" class="px-4 py-2 text-sm font-medium text-blue-600 hover:text-blue-800 hover:bg-blue-50 rounded">Mudar categoria</button>
        </div>

        <!-- Carrossel com Swiper -->
        <div class="swiper productCarousel">
          <div class="swiper-wrapper" id="productsCarousel">
            <!-- Produtos carregados dinamicamente -->
          </div>
          <div class="swiper-pagination"></div>
          <div class="swiper-button-prev"></div>
          <div class="swiper-button-next"></div>
        </div>
      </section>

      <!-- Seção de Detalhes do Produto -->
      <section id="detailsSection" class="mb-12 hidden">
        <button id="backToCarouselBtn" class="mb-6 px-4 py-2 text-sm font-medium text-blue-600 hover:text-blue-800 hover:bg-blue-50 rounded">← Voltar ao catálogo</button>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
          <!-- Imagens do Produto -->
          <div class="lg:col-span-2">
            <div class="mb-6">
              <img id="mainImage" src="" alt="Imagem principal do produto" class="w-full h-96 object-cover rounded-lg shadow-md" />
            </div>

            <!-- Miniaturas de Imagens -->
            <div class="flex gap-3" id="thumbnailsContainer">
              <!-- Miniaturas carregadas dinamicamente -->
            </div>
          </div>

          <!-- Informações do Produto -->
          <div class="space-y-6">
            <!-- Marca -->
            <div>
              <span id="productBrand" class="text-sm text-gray-500 font-semibold uppercase"></span>
            </div>

            <!-- Nome -->
            <div>
              <h1 id="productName" class="text-2xl font-bold text-gray-800"></h1>
            </div>

            <!-- Descrição -->
            <div>
              <p id="productDescription" class="text-gray-600 leading-relaxed text-sm"></p>
            </div>

            <!-- Seletores de Variação -->
            <div class="space-y-4 pt-6 border-t border-gray-200">
              <!-- Seletor de Tamanho -->
              <div>
                <label for="sizeSelect" class="block text-sm font-semibold text-gray-700 mb-2"> Tamanho </label>
                <select id="sizeSelect" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                  <option value="">Selecione o tamanho</option>
                </select>
              </div>

              <!-- Seletor de Cor -->
              <div>
                <label for="colorSelect" class="block text-sm font-semibold text-gray-700 mb-2"> Cor </label>
                <select id="colorSelect" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                  <option value="">Selecione a cor</option>
                </select>
              </div>

              <!-- Variação Selecionada (Resumo) -->
              <div id="selectedVariationDiv" class="p-4 bg-blue-50 border border-blue-200 rounded-lg hidden">
                <p class="text-sm text-gray-700"><strong>Selecionado:</strong> <span id="selectedVariationText"></span></p>
              </div>
            </div>

            <!-- Botão Adicionar ao Carrinho -->
            <div>
              <a
                id="addToCartBtn"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
                class="block w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg text-center transition-colors disabled:bg-gray-400 disabled:cursor-not-allowed"
              >
                Adicionar ao Carrinho
              </a>
            </div>

            <!-- Mensagem de Erro -->
            <div id="errorMessage" class="p-4 bg-red-50 border border-red-200 text-red-700 rounded-lg hidden text-sm"></div>
          </div>
        </div>
      </section>

      <!-- Mensagem de Carregamento -->
      <div id="loadingMessage" class="text-center py-12 hidden">
        <div class="inline-block">
          <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mb-4"></div>
          <p class="text-gray-600">Carregando...</p>
        </div>
      </div>

      <!-- Mensagem de Erro -->
      <div id="errorSection" class="bg-red-50 border border-red-200 text-red-700 p-6 rounded-lg hidden">
        <h3 class="font-semibold mb-2">Erro ao carregar dados</h3>
        <p id="errorText"></p>
      </div>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <!-- Catálogo JS -->
    <script src="../js/catalog.js"></script>
  </body>
</html>
