# Acorda o Render e mantém o Supabase ativo (o plano gratuito pausa por inatividade).
# Requer o segredo HEALTH_URL em Settings > Secrets and variables > Actions:
#   https://<app>.onrender.com/health/db
name: keepalive

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Chamar /health/db
        run: curl -fsS --retry 3 --max-time 60 "${{ secrets.HEALTH_URL }}"
